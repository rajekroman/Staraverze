name: Validate v5.4 continuation

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate

  browser:
    name: Playwright - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: iphone-portrait
            browser: chromium
          - project: iphone-landscape
            browser: chromium
          - project: desktop-webkit
            browser: webkit
          - project: iphone-portrait-webkit
            browser: webkit
          - project: iphone-landscape-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:smoke -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  offline:
    name: Playwright - offline-chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-offline-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 7
